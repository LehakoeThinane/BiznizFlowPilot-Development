services:
  # Images are built on GitHub's runners (.github/workflows/docker-publish.yml)
  # and pulled here, not built on the VM - this 1-vCPU/1GB free-tier instance
  # chokes if asked to build while also serving live traffic.
  backend:
    image: ghcr.io/lehakoethinane/biznizflowpilot-backend:latest
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "8000"

  # Beat runs embedded in the worker process (-B) rather than as its own
  # container, to fit a 1GB-RAM VM. Safe here because there's only ever one
  # worker replica - embedded beat double-schedules if run under multiple
  # concurrent worker processes, which this deployment never does.
  worker:
    image: ghcr.io/lehakoethinane/biznizflowpilot-backend:latest
    restart: unless-stopped
    env_file: .env.production
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-B", "--loglevel=INFO"]

  frontend:
    image: ghcr.io/lehakoethinane/biznizflowpilot-frontend:latest
    restart: unless-stopped
    environment:
      # Internal Docker network hop straight to the backend container -
      # faster and avoids an unnecessary public-internet round trip, since
      # both containers are already on the same host.
      BACKEND_URL: http://backend:8000
      SENTRY_DSN: ${SENTRY_DSN:-}
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./downloads:/srv/downloads:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:
